<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签选择 - 智能生活服务</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        button:hover {
            background-color: #45a049;
        }
        .info {
            color: #666;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>标签选择</h1>
        <p>您好，新用户！请选择您的偏好标签，我们将为您推荐符合您口味的餐厅：</p>
        <form action="/tag_selection" method="post">
            <input type="hidden" name="user_id" value="{{ user_id }}">
            <div class="form-group">
                <label for="cuisine">偏好菜系</label>
                <select id="cuisine" name="cuisine" required>
                    <option value="">请选择</option>
                    <option value="湘菜">湘菜</option>
                    <option value="川菜">川菜</option>
                    <option value="粤菜">粤菜</option>
                    <option value="西餐">西餐</option>
                    <option value="日韩料理">日韩料理</option>
                    <option value="快餐">快餐</option>
                    <option value="小吃">小吃</option>
                    <option value="素食">素食</option>
                </select>
            </div>
            <div class="form-group">
                <label for="price_range">价格区间</label>
                <select id="price_range" name="price_range" required>
                    <option value="">请选择</option>
                    <option value="经济型">经济型</option>
                    <option value="中档">中档</option>
                    <option value="高档">高档</option>
                </select>
            </div>
            <button type="submit">获取推荐</button>
        </form>
        <div class="info">
            <p>选择完成后，系统将基于您的偏好为您推荐合适的餐厅</p>
        </div>
    </div>
</body>
</html>
